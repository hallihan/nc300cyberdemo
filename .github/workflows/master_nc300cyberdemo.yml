# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nc300cyberdemo

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19 || >=22.12; 18.x cannot run the build.
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: 'Tar files'
        # Build the archive outside the tree being archived, then move it in.
        # Writing it into '.' mutates the directory while tar is reading it,
        # which GNU tar reports as "file changed as we read it" and exits 1.
        run: |
          tar --exclude='./.git' -czf "$RUNNER_TEMP/node-app.tar" .
          mv "$RUNNER_TEMP/node-app.tar" node-app.tar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./node-app.tar
          # the tarball is already gzipped; re-zipping it just burns CPU
          compression-level: 0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Untar files'
        run: tar -xzf node-app.tar

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'nc300cyberdemo'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A713E9B15BE046E1A48B4D6AF439B0D4 }}
          package: .
